<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Minecraft Server</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            border-radius: 16px;
            background: #1d1d1d;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #292929;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #43a047;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: 0;
            border-radius: 10px;
            background: #43a047;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #4cae4f;
        }

        button:active {
            transform: scale(0.98);
        }

        .error {
            color: #ff6b6b;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="card">
        <h1>🎮 Minecraft Server</h1>

        <form id="serverForm">
            <div class="form-group">
                <label for="serverName">Nama Server</label>
                <input type="text" id="serverName" placeholder="Contoh: Server Ku" required>
            </div>

            <div class="form-group">
                <label for="serverIp">IP / Hostname</label>
                <input type="text" id="serverIp" placeholder="Contoh: play.example.com" required>
            </div>

            <div class="form-group">
                <label for="serverPort">Port</label>
                <input type="number" id="serverPort" value="19132" placeholder="19132" required>
            </div>

            <button type="submit" id="connectButton">
                Buka di Minecraft
            </button>
        </form>

        <div id="error" class="error"></div>
    </main>

    <script>
        // Auto-fill dari URL Parameters jika ada (opsional)
        const params = new URLSearchParams(window.location.search);
        if (params.get("name")) document.getElementById("serverName").value = params.get("name");
        if (params.get("ip")) document.getElementById("serverIp").value = params.get("ip");
        if (params.get("port")) document.getElementById("serverPort").value = params.get("port");

        // Handle klik / submit form
        document.getElementById("serverForm").addEventListener("submit", (e) => {
            e.preventDefault();

            const name = document.getElementById("serverName").value.trim();
            const ip = document.getElementById("serverIp").value.trim();
            const port = document.getElementById("serverPort").value.trim();
            const errorDiv = document.getElementById("error");

            errorDiv.textContent = "";

            if (!name || !ip || !port) {
                errorDiv.textContent = "Semua kolom harus diisi!";
                return;
            }

            // Format URL Scheme Minecraft Bedrock / Pocket Edition
            const deepLink = `minecraft://?addExternalServer=${encodeURIComponent(name)}|${ip}:${port}`;

            // Buka aplikasi Minecraft
            window.location.href = deepLink;
        });
    </script>

</body>
</html>
