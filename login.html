<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Hosting Minecraft Terbaik!</title>
  <style>
    :root {
      --color-bg: #f3f5f3;
      --color-surface: #ffffff;
      --color-border: #e3e7e3;
      --color-text: #1e2b23;
      --color-text-muted: #6b776f;
      --color-accent: #1f6f4a;

      --radius: 10px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: var(--space-6) var(--space-3);
      background: var(--color-bg);
      color: var(--color-text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: var(--color-surface);
      border-radius: var(--radius);
      padding: var(--space-5);
      box-shadow: 0 4px 20px rgba(30, 43, 35, 0.08);
    }

    .card__header {
      text-align: center;
      margin-bottom: var(--space-5);
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 var(--space-1);
    }

    .subtitle {
      font-size: 13px;
      color: var(--color-text-muted);
      margin: 0;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
      display: block;
      margin-bottom: var(--space-1);
    }

    input {
      width: 100%;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      color: var(--color-text);
      background: var(--color-bg);
    }

    input:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 1px;
    }

    button {
      margin-top: var(--space-2);
      padding: var(--space-3);
      border: none;
      border-radius: var(--radius);
      background: var(--color-accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #185a3b;
    }

    .note {
      margin: var(--space-4) 0 0;
      font-size: 11px;
      color: var(--color-text-muted);
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="card__header">
      <h1>Selamat Datang Kembali</h1>
      <p class="subtitle">Masuk untuk melihat peringkat hosting Minecraft</p>
    </header>

    <form id="login-form">
      <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="Masukkan username">
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Masukkan password">
      </div>
      <button type="submit">Masuk</button>
    </form>

    <p class="note">*halaman ini hanya tampilan (front-end), belum ada validasi login sungguhan*</p>
  </main>

  <script>
    // Situs ini statis (GitHub Pages) sehingga tidak ada verifikasi kredensial nyata.
    // Untuk login sungguhan, dibutuhkan layanan auth pihak ketiga (mis. Firebase Auth, Auth0)
    // atau backend sendiri, karena GitHub Pages hanya menyajikan file statis.
    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
